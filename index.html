<style>
*{box-sizing:border-box}body{margin:0;color:#ede6dc;background:radial-gradient(ellipse at 51% 45%,#45404a 0%,#25232e 43%,#111018 90%);font:15px "DM Sans",system-ui,sans-serif}
main{height:100dvh;min-height:320px;position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}
header{position:absolute;top:clamp(18px,5vw,60px);left:clamp(18px,5vw,64px);pointer-events:none}h1{font:500 clamp(28px,5vw,70px)/1.1 Georgia,serif;margin:0;color:#ece0cf;letter-spacing:.07em}header p{color:#c7b898;letter-spacing:.12em;margin:8px 0}

output{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#27242e;padding:12px 18px;border-radius:8px}output:empty{display:none}
@media(max-width:560px){header{top:14px;left:16px}header p{font-size:12px;margin:3px 0}nav{gap:1px}button{font-size:14px;padding:10px}}
